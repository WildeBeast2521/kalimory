# Builds, signs and drafts a release when a v* tag is pushed (scripts/release.sh pushes it).
#
# The release key is held in the "release" environment's secrets (KALIMORY_KEYSTORE_BASE64,
# KALIMORY_KEYSTORE_PASSWORD, KALIMORY_KEY_ALIAS, KALIMORY_KEY_PASSWORD), which only v* tags may
# use. A key CI can use is a key anyone who can change a workflow can use, so this file, the
# pinned actions and master are what to protect. The workflow only drafts the release: a person
# reads it and publishes it.
name: Release

on:
  push:
    tags: ["v*"]

# Read by default. Only the job that drafts the release may write.
permissions:
  contents: read

jobs:
  verify:
    # A tag does not skip the checks: everything that guards master guards a release, and the
    # release job waits for it.
    uses: ./.github/workflows/android-ci.yml

  release:
    name: Sign and draft the release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Release checks
        # The tag names the versionName; CHANGELOG, its links and the store changelog are ready.
        run: echo "VERSION=$(scripts/release-checks.sh "$GITHUB_REF_NAME")" >> "$GITHUB_ENV"

      - name: Restore the signing key
        # Written to the runner's temporary folder and to an untracked keystore.properties; nothing
        # is printed. Without the secrets the build is unsigned, and the next steps refuse it.
        env:
          KEYSTORE_BASE64: ${{ secrets.KALIMORY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KALIMORY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KALIMORY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KALIMORY_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the release environment has no signing key"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Verify the APK
        # The project's certificate (Android refuses updates signed with another key), the package
        # and version, no INTERNET permission, and no permission the app does not declare.
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::no signed release APK; the signing secrets are missing or wrong"; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          cert="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$cert" = "$(cat .github/release-certificate.sha256)" || { echo "::error::signed with an unexpected certificate"; exit 1; }
          code="$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)"
          "$tools/aapt2" dump badging "$apk" | grep -q "package: name='io.github.wildebeast2521.kalimory' versionCode='$code' versionName='$VERSION'" \
            || { echo "::error::package name or version in the APK does not match"; exit 1; }
          if "$tools/aapt2" dump permissions "$apk" | grep -q android.permission.INTERNET; then
            echo "::error::the APK requests INTERNET"; exit 1
          fi
          # No other permission either that the app does not declare itself (a library's, merged in).
          scripts/check-apk-permissions.sh "$apk"
          echo "signed with the release key, version $VERSION ($code), no INTERNET"

      - name: Name the files and write the checksum and notes
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/kalimory-$VERSION.apk"
          (cd dist && sha256sum "kalimory-$VERSION.apk" | tee "kalimory-$VERSION.apk.sha256")
          python3 -I scripts/release-notes.py "$VERSION" > release-notes.md

      - name: Keep the R8 mapping file
        # Turns a reported stack trace back into source names. Download it from this run and keep
        # it with the release (AGENTS.md, "Versions and releases").
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ env.VERSION }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "dist/kalimory-$VERSION.apk" "dist/kalimory-$VERSION.apk.sha256"
          --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
