name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # The release workflow runs these checks before it signs anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets the schema check compare against the base commit.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Every heading has its link and the file follows Keep a Changelog 1.1.0; this also runs
      # on every release tag. Fix the links with: python3 -I scripts/changelog-links.py
      - name: Check CHANGELOG.md
        run: python3 -I scripts/changelog-links.py --check

      # Runs before the build, which would otherwise regenerate the schema first.
      - name: Check Room schemas
        timeout-minutes: 15
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit for this event; skipping the committed-schema immutability comparison."
          elif git cat-file -e "$base^{commit}" 2>/dev/null; then
            export SCHEMA_BASE_REF="$base"
          else
            echo "error: base commit $base is missing from the checkout (history rewritten?)." >&2
            exit 1
          fi
          scripts/check-room-schemas.sh --stacktrace

      - name: Run unit tests, lint, debug build, and androidTest compilation
        timeout-minutes: 20
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin --stacktrace

      # Kalimory is offline by design. Inspect the built APK so a transitive manifest contribution
      # cannot add network access unnoticed between the source review and a release.
      - name: Verify debug APK has no network permission
        run: |
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          if [ -z "$aapt" ]; then
            echo "::error::Android build tools do not provide aapt" >&2
            exit 1
          fi
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one debug APK, found ${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          if "$aapt" dump permissions "${apks[0]}" | grep -F "android.permission.INTERNET"; then
            echo "::error::debug APK requests INTERNET, violating Kalimory's offline design" >&2
            exit 1
          fi
          echo "debug APK has no INTERNET permission"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/outputs/roborazzi/**
          if-no-files-found: ignore
          retention-days: 7

  instrumentation:
    name: Instrumentation tests (API 29 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build outside the emulator step so the emulator only runs the tests.
      - name: Build app and test APKs
        timeout-minutes: 20
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run instrumentation tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 7
