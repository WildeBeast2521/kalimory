# Measures cold start on pull requests that change the app or the build (#155): the
# StartupBenchmark Macrobenchmark, without and with the Baseline Profile, on the same API 29
# emulator as the instrumented tests. It reports the numbers in the run summary and in one comment
# on the pull request, kept up to date. Emulator numbers vary between runs, so nothing fails on
# them; read them as a trend, and look again before a release.
name: Startup

on:
  pull_request:
    branches: [master]
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "baselineprofile/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      # And the measurement itself.
      - ".github/workflows/startup.yml"
      - "scripts/startup-report.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure cold start (API 29 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Writing the comment needs this; pull requests from forks get a read-only token and skip it.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build outside the emulator step so the emulator only runs the measurement.
      - name: Build the benchmark app and test APKs
        timeout-minutes: 20
        run: ./gradlew :app:assembleBenchmarkRelease :baselineprofile:assembleBenchmarkRelease --stacktrace

      - name: Measure cold start
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # The whole class: the cold starts run; the destination benchmarks need API 31 and skip.
          script: ./gradlew :baselineprofile:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.gonbei774.calisthenicsmemory.baselineprofile.StartupBenchmark --stacktrace

      - name: Write the report
        run: |
          result="$(find baselineprofile/build/outputs/connected_android_test_additional_output -name '*benchmarkData.json' | head -1)"
          test -n "$result" || { echo "::error::no benchmark result"; exit 1; }
          python3 -I scripts/startup-report.py "$result" | tee startup-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-benchmark
          path: baselineprofile/build/outputs/connected_android_test_additional_output/**/*benchmarkData.json
          if-no-files-found: error
          retention-days: 90

      - name: Report in the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --body-file startup-report.md 2>/dev/null \
            || gh pr comment "$PR" --body-file startup-report.md
