name: Bug report
description: Something in the app does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Please do not attach backups, exports or screenshots that show your own workout history. If data is needed to show the problem, make up a small example instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest list of taps that makes it happen.
      placeholder: |
        1. Open Library › Exercise catalogue
        2. Open the Push-up chain
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings shows it at the bottom.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: data-loss
    attributes:
      label: Was any workout data lost or changed?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Language, theme, how often it happens, or a screenshot without personal data.
